repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.292
    hooks:
      - id: ruff
        args:
          - "--line-length=155"
          - "--select=E,F,W"
          - "--ignore=E203,E226,W605"
          - "--exclude=__init__.py"
  # Ty: static type checking (local hook)
  - repo: local
    hooks:
      - id: ty
        name: ty (static type checking)
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false

  # Pydocstyle for docstrings
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        exclude: ^tests/|src/api/services/big_query_config_management/table_config\.py$
        args:
          - --select=D102,D103,D410,D411
